<style>
/* Layout: barra in alto con la settimana, schede (Settimana / Giorno / Spesa / Fuori casa / Regole), contenuto a colonna unica che diventa griglia su schermi larghi */
:root{
  --bg:#f5f6f1; --surface:#ffffff; --ink:#1d2722; --muted:#5d6b63; --line:#dde2da;
  --accent:#1d2c5e; --accent-ink:#ffffff; --accent-soft:#e3e8f4;
  --g1:#3f7a5a; --g1-soft:#e2efe6;
  --g2:#2f5d86; --g2-soft:#e1ebf4;
  --g3:#a5651a; --g3-soft:#f6ead8;
  --free:#7a6f8a; --free-soft:#ece8f1;
  --ok:#2e7d4f; --warn:#b26b00; --bad:#b3372b;
  --f-display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141a17; --surface:#1c2420; --ink:#e7ece8; --muted:#a2b0a8; --line:#2e3933;
  --accent:#7cc4d6; --accent-ink:#0d1832; --accent-soft:#1d2c40;
  --g1:#86c9a2; --g1-soft:#1f3328; --g2:#8db8e0; --g2-soft:#1d2b3a; --g3:#e0a65c; --g3-soft:#3a2b17;
  --free:#bcb0cf; --free-soft:#2c2734; --ok:#6fcf97; --warn:#f0b54a; --bad:#f08a7e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a17; --surface:#1c2420; --ink:#e7ece8; --muted:#a2b0a8; --line:#2e3933;
  --accent:#7cc4d6; --accent-ink:#0d1832; --accent-soft:#1d2c40;
  --g1:#86c9a2; --g1-soft:#1f3328; --g2:#8db8e0; --g2-soft:#1d2b3a; --g3:#e0a65c; --g3-soft:#3a2b17;
  --free:#bcb0cf; --free-soft:#2c2734; --ok:#6fcf97; --warn:#f0b54a; --bad:#f08a7e; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--accent)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--accent);color:var(--accent-ink)}
header.top .in{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand .logo{display:flex;align-items:center;gap:10px}
.brand .logo img{width:44px;height:44px;border-radius:50%;background:#fff;flex:0 0 auto}
.brand .sub{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;display:block;font-weight:500}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0;letter-spacing:-.01em}
.brand .wk{font-size:.9rem;opacity:.9}
.brand .acts{display:flex;gap:8px;flex-wrap:wrap}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:transparent;border:0;color:var(--accent-ink);opacity:.75;font:600 .9rem var(--f-body);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer}
nav.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--accent-ink)}
button,select,input{font-family:inherit;font-size:inherit}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 12px;font-weight:600;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
header .btn{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}
header .btn.solid{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}
.btn.small{padding:4px 9px;font-size:.8rem;font-weight:500}
:focus-visible{outline:3px solid var(--g3);outline-offset:2px}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:22px 0 10px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:1.05rem;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
section[hidden]{display:none}

/* status strip */
.checks{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 4px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.pill .dot{width:8px;height:8px;border-radius:50%}
.pill.ok .dot{background:var(--ok)} .pill.warn .dot{background:var(--warn)} .pill.bad .dot{background:var(--bad)}
details.checkd{margin:6px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
details.checkd summary{cursor:pointer;font-weight:600}
.checklist{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:6px}
.checklist li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:.88rem}
.sym{font-weight:700}
.sym.ok{color:var(--ok)} .sym.warn{color:var(--warn)} .sym.bad{color:var(--bad)}

/* week grid */
.week{display:grid;gap:10px;margin-top:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:110px 1fr 1fr;gap:12px;align-items:start}
.day.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dname{font-family:var(--f-display);font-weight:700;font-size:1.02rem;line-height:1.2}
.dname small{display:block;font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem}
.meal{min-width:0;border-left:3px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:5px}
.meal.g1{border-left-color:var(--g1)} .meal.g2{border-left-color:var(--g2)} .meal.g3{border-left-color:var(--g3)} .meal.free{border-left-color:var(--free)}
.mhead{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.slot{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip{font-size:.7rem;font-weight:600;border-radius:5px;padding:1px 6px}
.chip.g1{background:var(--g1-soft);color:var(--g1)} .chip.g2{background:var(--g2-soft);color:var(--g2)} .chip.g3{background:var(--g3-soft);color:var(--g3)} .chip.free{background:var(--free-soft);color:var(--free)}
.chip.out{background:var(--accent-soft);color:var(--accent)}
.chip.tag{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.mtext{font-size:.93rem}
.mtools{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;font-size:.8rem;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
@media (max-width:760px){.day{grid-template-columns:1fr}.meal{padding-left:10px}}

/* day view */
.dayview{max-width:640px;margin:0 auto}
.daynav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:16px 0 8px}
.daynav .t{text-align:center;flex:1}
.daynav .t b{font-family:var(--f-display);font-size:1.4rem;display:block;line-height:1.15}
.dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:.75rem;cursor:pointer;padding:0}
.dots button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bigmeal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.bigmeal .mtext{font-size:1.08rem;line-height:1.45}
.bigmeal.g1{border-top:4px solid var(--g1)} .bigmeal.g2{border-top:4px solid var(--g2)} .bigmeal.g3{border-top:4px solid var(--g3)} .bigmeal.free{border-top:4px solid var(--free)}
.outbox{background:var(--bg);border-radius:8px;padding:10px 12px;display:grid;gap:8px}
.outitem{display:grid;gap:2px;font-size:.9rem}
.outitem .where{font-size:.78rem;color:var(--muted)}
.tip{font-size:.85rem;color:var(--muted);border-left:3px solid var(--g3);padding-left:10px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:85vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:14px}}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.optlist{display:grid;gap:6px}
.opt{text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 11px;cursor:pointer;display:grid;gap:3px;font-size:.9rem}
.opt:hover{border-color:var(--accent)}
.filter{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}

/* shopping */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:12px}
.shopcat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.shopcat.rare{border-color:var(--g3);background:var(--g3-soft)}
.shopcat ul{list-style:none;padding:0;margin:6px 0 0;display:grid;gap:2px}
.shopcat li label{display:grid;grid-template-columns:22px 1fr auto;gap:6px;align-items:baseline;padding:4px 0;cursor:pointer;font-size:.92rem}
.shopcat li .q{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.85rem;white-space:nowrap}
.shopcat li .days{grid-column:2/4;font-size:.75rem;color:var(--muted);margin-top:-3px}
.shopcat li.done label span.n{text-decoration:line-through;color:var(--muted)}
.copybox{width:100%;min-height:120px;margin-top:8px;font:.85rem/1.4 ui-monospace,Menlo,monospace;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}

/* lists / rules */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.card ul,.card ol{margin:6px 0 0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.src{font-size:.75rem;color:var(--muted)}

/* settings */
.settings{display:grid;gap:14px}
.field{display:grid;gap:4px}
.field label.l{font-weight:600;font-size:.88rem}
.field select,.field input[type=date],.field input[type=number]{border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--bg);color:var(--ink);max-width:240px}
.daychecks{display:flex;flex-wrap:wrap;gap:6px}
.daychecks label{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:.85rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.88rem;z-index:30}
.syncnote{font-size:.78rem;opacity:.85}

#print-area{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:10.5pt}
  body::before,header.top,.wrap,.sheet-bg,.toast{display:none!important}
  #print-area{display:block!important}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parseISO(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function nextMonday(){const t=new Date();t.setHours(0,0,0,0);const wd=(t.getDay()+6)%7;return wd===0?t:addDays(t,7-wd);}
function dateLabel(start,i){const d=addDays(parseISO(start),i);return d.getDate()+" "+MONTHS[d.getMonth()];}
const isMeat = m => m && (m.p==="carne"||m.p==="aff"||m.meat);

const protCat = m => !m||!m.p?null:(m.p==="aff"?"carne":m.p);

const sameProt = (a,b) => protSet(a).some(x=>protSet(b).includes(x));
const inSeason = (m,month) => !m.m || m.m.includes(month);

const DEFAULT_SETTINGS = {persons:1,out:[false,false,false,false,false,false],scarico:"auto",start:iso(nextMonday())};

/* ===================== MOTORE: risoluzione segnaposto ===================== */
function vegPool(month,pred){return VEG.filter(v=>v.m.includes(month)&&pred(v));}
function pickLeast(list,usage,exclude){
  const c = list.filter(x=>!exclude.includes(x)); const pool=c.length?c:list;
  let min=Infinity; pool.forEach(x=>{min=Math.min(min,usage[x]||0)});
  const best=pool.filter(x=>(usage[x]||0)===min); const r=rnd(best); usage[r]=(usage[r]||0)+1; return r;
}
function resolveMeal(item,month,usage){
  const used=[]; const ing=item.ing.map(x=>({...x}));
  const fish=isFish(item);
  const vn = v=>v.n;
  const raw = vegPool(month,v=>v.cr).map(vn);
  const cooked = vegPool(month,v=>v.cot&&!(fish&&v.leaf)).map(vn);
  const inSeasonSet = new Set(VEG.filter(v=>v.m.includes(month)).map(vn));
  const addV = n=>{ing.push({n,q:1,u:"porz.",c:"V",r:!!(VEG.find(v=>v.n===n)||{}).rare});used.push(n);};
  let t = item.t.replace(/\{(C|R|G|P|T|F|K|Q|D)\}/g,(_,k,off,str)=>{
    if(k==="C"){const v=pickLeast(raw,usage,used);addV(v);return str[off-1]==="("?v:"verdura cruda ("+v+")";}
    if(k==="R"){const v=pickLeast(cooked,usage,used);addV(v);return v;}
    if(k==="G"){let l=GRILL.filter(x=>inSeasonSet.has(x));if(!l.length)l=["radicchio","insalata belga"];const v=pickLeast(l,usage,used);addV(v);return v;}
    if(k==="T"){let l=TRIF.filter(x=>inSeasonSet.has(x));if(!l.length)l=["zucchine"];const v=pickLeast(l,usage,used);addV(v);return v;}
    if(k==="D"){let l=FISHPAN.filter(x=>inSeasonSet.has(x));if(!l.length)l=["radicchio"];const v=pickLeast(l,usage,used);addV(v);return v;}
    if(k==="P"){let l=PINZ.filter(x=>inSeasonSet.has(x));const a=pickLeast(l,usage,used);used.push(a);const b=pickLeast(l,usage,used);addV(a);addV(b);return "pinzimonio ("+a+" e "+b+")";}
    if(k==="F"){const l=FRUIT.filter(f=>f.m.includes(month)).map(f=>f.n);const f=pickLeast(l,usage,used);used.push(f);ing.push({n:f,q:1,u:"pz",c:"V"});return "1 frutto ("+f+")";}
    if(k==="K"){let l=vegPool(month,v=>v.cot).map(vn).concat(["carote","patate"]);const a=pickLeast(l,usage,used);used.push(a);const b=pickLeast(l.filter(x=>x!==a),usage,used);addV(a);addV(b);return a+" e "+b;}
    if(k==="Q"){const q=rnd(CEREALI);ing.push({n:q,q:90,u:"g",c:"B"});return q;}
  });
  return {id:item.id,text:t,ing};
}

/* ===================== MOTORE: regole ===================== */
// slot: [dayIndex, "L"|"D"]; ordine dei pasti nella settimana
const ORDER = []; for(let d=0;d<7;d++){ORDER.push([d,"L"]);ORDER.push([d,"D"]);}
const isFreeSlot = (d,s) => (d===5&&s==="D")||(d===6&&s==="L");
function mealAt(plan,d,s){const x=plan.days[d][s];return x&&x.id?BYID[x.id]:null;}
function groupOf(plan,d,s){const x=plan.days[d][s];return x?x.grp:null;}

function poolFor(month,{group,dinner,out}){
  const src = out?OUTS:MEALS;
  return src.filter(m=>m.g.includes(group) && inSeason(m,month) && !(dinner&&m.noDin));
}
// controlli "duri" tra un pasto e i suoi vicini
function compatible(plan,d,s,m,grp,opts={}){
  if(s==="D"&&m.noDin) return false;
  if(grp===3&&s!=="D") return false;
  const other = s==="L"?mealAt(plan,d,"D"):mealAt(plan,d,"L");
  if(other){
    if(m.lat&&other.lat) return false;                      // latticini/uova in un solo pasto
    if(sameProt(m,other)) return false; // stessa proteina
    if(isMeat(m)&&isMeat(other)) return false;
  }
  if(s==="L" && groupOf(plan,d,"D")===3 && !m.p) return false; // pranzo proteico prima dello scarico
  if(d===5&&s==="L"&&!m.pre) return false;                     // prima del pasto libero
  // carne non in due pasti consecutivi
  if(isMeat(m)){
    const idx=ORDER.findIndex(o=>o[0]===d&&o[1]===s);
    for(const k of [idx-1,idx+1]){ if(k<0||k>=ORDER.length) continue; const [dd,ss]=ORDER[k]; if(isMeat(mealAt(plan,dd,ss))) return false; }
    let n=0; ORDER.forEach(([dd,ss])=>{if(!(dd===d&&ss===s)&&isMeat(mealAt(plan,dd,ss)))n++;});
    if(n>=3) return false;
  }
  if(!opts.allowDup){ for(const [dd,ss] of ORDER){ if(dd===d&&ss===s) continue; const x=plan.days[dd][ss]; if(x&&x.id===m.id) return false; } }
  return true;
}

function emptyPlan(start){return {start,days:DAYS.map(()=>({L:null,D:null}))};}
function tryBuild(st){
  const month = parseISO(st.start).getMonth()+1;
  const plan = emptyPlan(st.start);
  plan.days[5].D={free:1,grp:"free"}; plan.days[6].L={free:1,grp:"free"};
  let g3 = st.scarico==="auto" ? rnd([1,2,2,2,3,3,4]) : +st.scarico;
  // domenica sera: scarico (di solito verdura cruda e ripassata)
  const sun = Math.random()<0.6?BYID.z1:rnd(poolFor(month,{group:3,dinner:true}));
  plan.days[6].D={id:sun.id,grp:3};
  for(let d=0;d<6;d++){
    let pat;
    if(d===5) pat={L:rnd([1,2])};
    else if(d===g3) pat={L:rnd([1,2,2]),D:3};
    else pat = Math.random()<0.65?{L:1,D:2}:{L:2,D:1};
    if(pat.D){ // scegli prima la cena se è scarico, così il pranzo ne tiene conto
      const order = pat.D===3?["D","L"]:["L","D"];
      for(const s of order){
        const grp=pat[s];
        if(s==="D"&&grp===3) plan.days[d].D={grp:3,id:null};
        const cands = shuffle(poolFor(month,{group:grp,dinner:s==="D",out:s==="L"&&st.out[d]})).filter(m=>compatible(plan,d,s,m,grp));
        if(!cands.length) return null;
        plan.days[d][s]={id:cands[0].id,grp};
      }
    } else {
      let grp=pat.L;
      let cands = shuffle(poolFor(month,{group:grp,dinner:false,out:st.out[d]})).filter(m=>compatible(plan,d,"L",m,grp));
      if(!cands.length){grp=3-grp+0; grp=grp===1?1:2; cands=shuffle(poolFor(month,{group:pat.L===1?2:1,dinner:false,out:st.out[d]})).filter(m=>compatible(plan,d,"L",m,pat.L===1?2:1)); grp=pat.L===1?2:1;}
      if(!cands.length) return null;
      plan.days[d].L={id:cands[0].id,grp};
    }
  }
  return plan;
}
function softScore(plan){
  let pen=0; const ms=[];
  ORDER.forEach(([d,s])=>{const m=mealAt(plan,d,s); if(m) ms.push(m);});
  const fish=ms.filter(isFish).length; if(fish<2) pen+=(2-fish)*4; if(fish>3) pen+=(fish-3)*3;
  const tonno=ms.filter(m=>m.noDin&&m.fish).length; if(tonno>2) pen+=(tonno-2)*2;
  const primi=ms.filter(m=>m.primo).length; if(primi>3) pen+=(primi-3)*3; if(primi===0) pen+=2;
  const leg=ms.filter(m=>m.p==="leg").length; if(leg===0) pen+=3; if(leg>4) pen+=leg-4;
  const eggs=ms.filter(m=>m.p==="uova").length; if(eggs>2) pen+=(eggs-2)*2;
  const meat=ms.filter(isMeat).length; if(meat===0) pen+=1;
  const fritti=ms.filter(m=>m.fritto).length; if(fritti>1) pen+=(fritti-1)*3;
  const ex=ms.filter(m=>m.src==="es").length; pen += Math.max(0,3-ex)*0.5;
  for(let d=0;d<5;d++){
    const L=mealAt(plan,d,"L"),D=mealAt(plan,d,"D");
    if(isFish(L)&&isFish(D)) pen+=2;
    if(plan.days[d].D.grp===3&&L&&L.p==="leg") pen+=1;
    const main=[L,D].filter(m=>m&&m.p&&m.p!=="leg"&&m.g.includes(2)).length;
    if(main>1) pen+=1;
  }
  return pen;
}
function generate(st){
  let best=null,bs=Infinity;
  for(let i=0;i<500;i++){
    const p=tryBuild(st); if(!p) continue;
    const s=softScore(p)+Math.random()*0.4; if(s<bs){bs=s;best=p;} if(bs<0.5) break;
  }
  if(!best) return null;
  resolveAll(best);
  return best;
}
function resolveAll(plan){
  const month=parseISO(plan.start).getMonth()+1; const usage={};
  ORDER.forEach(([d,s])=>{const x=plan.days[d][s]; if(x&&x.id){const r=resolveMeal(BYID[x.id],month,usage); x.text=r.text; x.ing=r.ing;}});
}
function resolveOne(plan,d,s){
  const month=parseISO(plan.start).getMonth()+1; const usage={};
  ORDER.forEach(([dd,ss])=>{const x=plan.days[dd][ss]; if(x&&x.ing&&!(dd===d&&ss===s)) x.ing.forEach(i=>{if(i.c==="V")usage[i.n]=(usage[i.n]||0)+1;});});
  const x=plan.days[d][s]; const r=resolveMeal(BYID[x.id],month,usage); x.text=r.text; x.ing=r.ing;
}

/* alternative valide per uno slot */
function allowedGroups(plan,d,s){
  if(isFreeSlot(d,s)) return [];
  if(d===6&&s==="D") return [3];
  if(d===5&&s==="L") return [1,2];
  const other = plan.days[d][s==="L"?"D":"L"]; const og=other?other.grp:null;
  if(s==="L"){ if(og===3) return [1,2]; if(og===1) return [2]; if(og===2) return [1]; return [1,2]; }
  // cena
  const lm=mealAt(plan,d,"L"); const res=[]; if(og===1) res.push(2); if(og===2) res.push(1); if(lm&&lm.p) res.push(3); return res;
}
function alternatives(plan,d,s,out){
  const month=parseISO(plan.start).getMonth()+1; const res=[];
  const saved=plan.days[d][s]; plan.days[d][s]=null;
  for(const g of allowedGroups(plan,d,s)){
    const tmp={...saved,grp:g};
    if(s==="D"&&g===3){plan.days[d].D={grp:3};}
    poolFor(month,{group:g,dinner:s==="D",out}).forEach(m=>{
      if(m.id===(saved&&saved.id)) return;
      if(compatible(plan,d,s,m,g)) res.push({m,g});
    });
    plan.days[d][s]=null;
  }
  plan.days[d][s]=saved;
  // il pranzo prima dello scarico deve restare proteico
  return res;
}
function setMeal(d,s,id,g){
  S.plan.days[d][s]={id,grp:g}; resolveOne(S.plan,d,s); save(); render();
}

/* ===================== CONTROLLI SULLE REGOLE ===================== */
function checks(plan){
  const R=[]; const ms=[]; ORDER.forEach(([d,s])=>{const m=mealAt(plan,d,s); if(m) ms.push({d,s,m,g:plan.days[d][s].grp});});
  const add=(st,t,detail)=>R.push({st,t,detail});
  // composizione
  let compOk=true; const compBad=[];
  for(let d=0;d<5;d++){const a=plan.days[d].L.grp,b=plan.days[d].D.grp; const ok=(a===1&&b===2)||(a===2&&b===1)||((a===1||a===2)&&b===3); if(!ok){compOk=false;compBad.push(DSH[d]);}}
  add(compOk?"ok":"bad","Ogni giorno un'alternativa del Gruppo 1 e una del Gruppo 2, oppure Gruppo 1 o 2 più una cena del Gruppo 3",compBad.length?"Da sistemare: "+compBad.join(", "):"");
  // scarico
  const g3=[]; for(let d=0;d<7;d++) if(plan.days[d].D&&plan.days[d].D.grp===3) g3.push(d);
  let scSt="ok",scD="";
  if(!g3.includes(6)){scSt="warn";scD="Manca la domenica sera.";}
  for(let i=1;i<g3.length;i++) if(g3[i]-g3[i-1]===1){scSt="bad";scD="Due cene di scarico in giorni consecutivi.";}
  if(g3.includes(0)){scSt=scSt==="bad"?"bad":"warn";scD+=" Lunedì segue la domenica sera di scarico.";}
  if(g3.length!==2&&scSt==="ok"){scSt="warn";scD=g3.length+" cene di scarico (consigliate 2).";}
  add(scSt,"Cene di scarico: 2 a settimana, domenica sera e una sera infrasettimanale, mai consecutive",(scD||"Sere: "+g3.map(d=>DSH[d]).join(" e ")).trim());
  // pranzo proteico prima dello scarico
  const bad1=g3.filter(d=>d!==6&&!(mealAt(plan,d,"L")||{}).p).map(d=>DSH[d]);
  add(bad1.length?"bad":"ok","Prima di una cena di scarico, a pranzo una proteina come piatto principale",bad1.length?"Da sistemare: "+bad1.join(", "):"");
  // carne
  const meat=ms.filter(x=>isMeat(x.m)); let consec=false;
  for(let i=1;i<ORDER.length;i++){const a=mealAt(plan,...ORDER[i-1]),b=mealAt(plan,...ORDER[i]); if(isMeat(a)&&isMeat(b)) consec=true;}
  add(consec||meat.length>3?"bad":"ok","Carne o affettati in non più di 2-3 pasti e mai in due pasti consecutivi",meat.length+" pasti con carne o affettati"+(consec?", due consecutivi":""));
  // latticini/uova
  const lat=[]; for(let d=0;d<5;d++){if(mealAt(plan,d,"L").lat&&mealAt(plan,d,"D").lat) lat.push(DSH[d]);}
  add(lat.length?"bad":"ok","Latticini o uova in un solo pasto della giornata",lat.length?"Da sistemare: "+lat.join(", "):"");
  // stessa proteina
  const sp=[]; for(let d=0;d<5;d++){if(sameProt(mealAt(plan,d,"L"),mealAt(plan,d,"D"))) sp.push(DSH[d]);}
  add(sp.length?"bad":"ok","A pranzo niente carne, affettati, uova, formaggi o legumi se sono già previsti a cena",sp.length?"Da sistemare: "+sp.join(", "):"");
  // cena vietati
  const nd=ms.filter(x=>x.s==="D"&&x.m.noDin).map(x=>DSH[x.d]);
  add(nd.length?"bad":"ok","A cena niente tonno in scatola, salmone affumicato, mozzarella o affettati",nd.length?"Da sistemare: "+nd.join(", "):"");
  // prima del pasto libero
  const sat=mealAt(plan,5,"L");
  add(sat&&sat.pre?"ok":"warn","Prima del pasto libero (sabato a pranzo): legumi, insalata con avocado oppure uova","");
  // proteina principale una volta al giorno
  const pm=[]; for(let d=0;d<5;d++){const L=mealAt(plan,d,"L"),D=mealAt(plan,d,"D"); if(![L,D].some(m=>m&&m.p)) pm.push(DSH[d]);}
  add(pm.length?"warn":"ok","Uno dei due pasti con una proteina come piatto principale",pm.length?"Senza proteina: "+pm.join(", "):"");
  const fish=ms.filter(x=>isFish(x.m)).length;
  add("ok","Garantite dalle ricette: niente pane o frutta con il primo, fritto sempre con verdura cruda, con il pesce niente verdura cotta a foglia verde","Pesce in "+fish+" pasti questa settimana");
  return R;
}

/* ===================== LISTA DELLA SPESA ===================== */
function shopping(plan){
  const k=S.settings.persons||1; const map={};
  ORDER.forEach(([d,s])=>{const x=plan.days[d][s]; if(!x||!x.ing) return; x.ing.forEach(i=>{
    const key=i.n+"|"+i.u; if(!map[key]) map[key]={...i,q:0,days:new Set()};
    map[key].q+=i.q*k; map[key].r=map[key].r||i.r; map[key].days.add(d);
  });});
  return Object.values(map);
}
function fmtQ(i){
  if(i.u==="porz.") return i.q===1?"1 porzione":(Math.round(i.q*10)/10)+" porzioni";
  if(i.u==="g"&&i.q>=1000) return (Math.round(i.q/100)/10).toString().replace(".",",")+" kg";
  const q=Math.round(i.q*10)/10; return String(q).replace(".",",")+" "+i.u;
}

function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function loadLocal(){try{const x=localStorage.getItem(LS); if(x) return JSON.parse(x);}catch(e){} return null;}
let saveTimer=null;
function save(){
  saveLocal();
  if(dbDoc){ clearTimeout(saveTimer); saveTimer=setTimeout(()=>{dbDoc.set(JSON.parse(JSON.stringify(S))).catch(()=>{});},600); }
}
function applyState(x){
  if(!x) return;
  S.settings={...DEFAULT_SETTINGS,...(x.settings||{})};
  S.plan=x.plan||null; S.checked=x.checked||{}; S.history=x.history||[];
}
async function initSync(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const id=await user.id(); if(!id) return;
    dbDoc=db.collection("data/users/"+id).doc("stato");
    const snap=await dbDoc.get();
    if(snap.exists){ applyState(snap.data()); saveLocal(); render(); }
    else if(S.plan){ dbDoc.set(JSON.parse(JSON.stringify(S))).catch(()=>{}); }
    syncMode="cloud"; renderHeader();
  }catch(e){ dbDoc=null; }
}

/* ===================== AZIONI ===================== */
function newWeek(){
  const p=generate(S.settings);
  if(!p){toast("Non sono riuscito a comporre la settimana con queste impostazioni. Prova a cambiare i pranzi fuori casa.");return;}
  if(S.plan){S.history.unshift(S.plan); S.history=S.history.slice(0,8);}
  S.plan=p; S.checked={}; save(); render(); toast("Nuova proposta pronta");
}
function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2600);}

/* ===================== RENDER ===================== */
function grpChip(g){ if(g==="free") return '<span class="chip free">Libero</span>'; return '<span class="chip g'+g+'">'+(g===3?"Scarico":"Gruppo "+g)+'</span>'; }
function tagsFor(m){
  const t=[]; if(!m) return "";
  if(m.out) t.push('<span class="chip out">Fuori casa</span>');
  if(m.p) t.push('<span class="chip tag">'+PLAB[m.p]+'</span>');
  if(m.primo) t.push('<span class="chip tag">primo</span>');
  if(m.fritto) t.push('<span class="chip tag">fritto</span>');
  return t.join("");
}
function mealBlock(d,s,big){
  const x=S.plan.days[d][s]; const slot=s==="L"?"Pranzo":"Cena";
  if(!x||x.free){
    return `<div class="${big?"bigmeal":"meal"} free"><div class="mhead"><span class="slot">${slot}</span>${grpChip("free")}</div><div class="mtext">Pasto libero</div></div>`;
  }
  const m=BYID[x.id];
  const note=m.note?`<div class="small muted">Nota: ${esc(m.note)}</div>`:"";
  const where=m.out?`<div class="small muted">Dove: ${esc(m.where)}</div>`:"";
  const tools = `<div class="mtools"><button class="linkbtn" data-act="swap" data-d="${d}" data-s="${s}">Cambia</button><button class="linkbtn" data-act="choose" data-d="${d}" data-s="${s}">Scegli</button>${(d===6&&s==="D")?"":`<button class="linkbtn" data-act="out" data-d="${d}" data-s="${s}">Se mangio fuori</button>`}</div>`;
  let extra="";
  if(big && !(d===6&&s==="D")){
    const outs=alternatives(S.plan,d,s,true).filter(a=>a.g===x.grp||allowedGroups(S.plan,d,s).includes(a.g)).slice(0,5);
    if(outs.length) extra=`<div class="outbox"><div class="slot">Se mangi fuori, va bene anche</div>${outs.map(a=>`<div class="outitem"><span>${esc(a.m.t)}</span><span class="where">${esc(a.m.where)}</span></div>`).join("")}</div>`;
  }
  return `<div class="${big?"bigmeal":"meal"} g${x.grp}"><div class="mhead"><span class="slot">${slot}</span>${grpChip(x.grp)}${tagsFor(m)}</div><div class="mtext">${esc(x.text||m.t)}</div>${where}${note}${tools}${extra}</div>`;
}
function todayIdx(){ if(!S.plan) return -1; const t=new Date();t.setHours(0,0,0,0); const diff=Math.round((t-parseISO(S.plan.start))/864e5); return diff>=0&&diff<7?diff:-1; }

function renderHeader(){
  const el=document.getElementById("wkLabel");
  if(!S.plan){el.textContent="";return;}
  const a=parseISO(S.plan.start), b=addDays(a,6);
  el.innerHTML=`Settimana dal ${a.getDate()} ${MONTHS[a.getMonth()]} al ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()} <span class="syncnote">· ${syncMode==="cloud"?"salvata sul tuo account":"salvata su questo dispositivo"}</span>`;
}
function renderWeek(){
  const el=document.getElementById("tab-settimana");
  if(!S.plan){el.innerHTML=`<h2>Nessuna settimana</h2><p><button class="btn primary" data-act="new">Crea la prima proposta</button></p>`;return;}
  const C=checks(S.plan); const n={ok:0,warn:0,bad:0}; C.forEach(c=>n[c.st]++);
  const ti=todayIdx();
  el.innerHTML = `
  <div class="checks">
    <span class="pill ${n.bad?"bad":n.warn?"warn":"ok"}"><span class="dot"></span>${n.bad?n.bad+" regole da sistemare":n.warn?"Regole rispettate, "+n.warn+" da verificare":"Tutte le regole rispettate"}</span>
    <span class="pill"><span class="dot" style="background:var(--g1)"></span>Gruppo 1: piatti unici e insalate</span>
    <span class="pill"><span class="dot" style="background:var(--g2)"></span>Gruppo 2: secondi</span>
    <span class="pill"><span class="dot" style="background:var(--g3)"></span>Gruppo 3: cena di scarico</span>
  </div>
  <details class="checkd"><summary>Controllo delle regole della dottoressa</summary>
    <ul class="checklist">${C.map(c=>`<li><span class="sym ${c.st}">${c.st==="ok"?"✓":c.st==="warn"?"!":"✕"}</span><span>${esc(c.t)}${c.detail?`<br><span class="muted small">${esc(c.detail)}</span>`:""}</span></li>`).join("")}</ul>
  </details>
  <div class="week">${DAYS.map((dn,d)=>`
    <div class="day ${d===ti?"today":""}">
      <div class="dname">${dn}<small>${dateLabel(S.plan.start,d)}${S.settings.out[d]?" · pranzo fuori":""}</small></div>
      ${mealBlock(d,"L")}${mealBlock(d,"D")}

  </div>
  <p class="small muted">Colazioni e merende: a scelta dalla scheda Colazioni e merende. Quantità indicate per 1 persona, come nelle settimane della dottoressa.</p>`;
}
function renderDay(){
  const el=document.getElementById("tab-giorno");
  if(!S.plan){el.innerHTML="";return;}
  const d=ui.day;
  el.innerHTML=`<div class="dayview">
    <div class="daynav"><button class="btn" data-act="prev" ${d===0?"disabled":""} aria-label="Giorno precedente">‹</button>
      <div class="t"><b>${DAYS[d]}</b><span class="muted">${dateLabel(S.plan.start,d)}${S.settings.out[d]?" · pranzo fuori casa":""}</span></div>
      <button class="btn" data-act="next" ${d===6?"disabled":""} aria-label="Giorno successivo">›</button></div>
    <div class="dots">${DSH.map((x,i)=>`<button data-act="goday" data-d="${i}" aria-current="${i===d}">${x[0]}${x[1]}</button>`).join("")}</div>
    ${mealBlock(d,"L",true)}${mealBlock(d,"D",true)}
    <p class="tip">Merende solo in caso di fame o dopo lo sport. Se scegli la frutta, aggiungi sempre noci, mandorle, nocciole o semi.</p>
  </div>`;
}
function renderShop(){
  const el=document.getElementById("tab-spesa");
  if(!S.plan){el.innerHTML="";return;}
  const items=shopping(S.plan);
  const rare=items.filter(i=>i.r).sort((a,b)=>a.n.localeCompare(b.n));
  const byCat={}; items.filter(i=>!i.r).forEach(i=>{(byCat[i.c]=byCat[i.c]||[]).push(i);});
  const li=i=>{const key=i.n+"|"+i.u; const done=S.checked[key]; return `<li class="${done?"done":""}"><label><input type="checkbox" data-shop="${esc(key)}" ${done?"checked":""}><span class="n">${esc(i.n)}</span><span class="q">${fmtQ(i)}</span><span class="days">${[...i.days].sort().map(d=>DSH[d]).join(", ")}</span></label></li>`;};
  const total=items.length, done=items.filter(i=>S.checked[i.n+"|"+i.u]).length;
  el.innerHTML=`<h2>Lista della spesa</h2>
  <p class="muted small">Per ${S.settings.persons} ${S.settings.persons>1?"persone":"persona"}, pasti liberi esclusi. Olio, sale, aglio e spezie non sono in lista. Sotto ogni voce i giorni in cui serve: il pesce fresco conviene comprarlo a ridosso. ${done}/${total} presi.</p>
  <div class="filter"><button class="btn small" data-act="copyshop">Copia la lista</button><button class="btn small" data-act="clearshop">Azzera le spunte</button></div>
  <div class="shopgrid">
    ${rare.length?`<div class="shopcat rare"><h3>Da procurare in anticipo</h3><p class="small muted" style="margin:0">Meno facili da trovare o da ordinare in pescheria.</p><ul>${rare.map(li).join("")}</ul></div>`:""}
    ${Object.keys(CATS).filter(c=>byCat[c]).map(c=>`<div class="shopcat"><h3>${CATS[c]}</h3><ul>${byCat[c].sort((a,b)=>a.n.localeCompare(b.n)).map(li).join("")}</ul></div>`).join("")}
  </div>
  <textarea class="copybox" id="copybox" hidden readonly></textarea>`;
}

  document.getElementById("tab-colazioni").innerHTML=`<h2>Colazioni e merende</h2>
  <div class="cards">
   <div class="card"><h3>Colazioni</h3><ul>${COLAZIONI.map(c=>`<li>${esc(c)}</li>`).join("")}</ul><p class="src">Fonte: schema alimentare</p></div>

function render(){
  renderHeader();
  if(S.plan) ui.day=Math.min(6,Math.max(0,ui.day));
  renderWeek(); renderDay(); renderShop(); renderOut(); renderBreak(); renderRules();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===ui.tab)));
  document.querySelectorAll("main > section").forEach(s=>s.hidden=s.id!=="tab-"+ui.tab);
}

/* ===================== FOGLI (scegli, fuori casa, impostazioni) ===================== */
function openSheet(title,html,onClick){
  const root=document.getElementById("sheetRoot");
  root.innerHTML=`<div class="sheet-bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h3 style="margin:0">${esc(title)}</h3><button class="btn small" data-close>Chiudi</button></header>${html}</div></div>`;
  const bg=root.firstChild;
  bg.addEventListener("click",e=>{ if(e.target===bg||e.target.closest("[data-close]")){root.innerHTML="";return;} if(onClick) onClick(e,()=>root.innerHTML=""); });
}
function openChoose(d,s,out){
  const alts=alternatives(S.plan,d,s,out);
  const slot=(s==="L"?"pranzo":"cena")+" di "+DAYS[d].toLowerCase();
  const html = alts.length? `<p class="small muted">${alts.length} alternative compatibili con il resto della settimana${out?" (da bar o ristorante)":""}.</p><div class="optlist">${alts.map(a=>`<button class="opt" data-id="${a.m.id}" data-g="${a.g}"><span>${grpChip(a.g)} ${tagsFor(a.m)}</span><span>${esc(a.m.t.replace(/ \(\{[A-Z]\}\)/g,"").replace(/\{(C|R|G|P|T|F|K|Q|D)\}/g,(_,k)=>({C:"verdura cruda",R:"verdura ripassata",G:"verdure alla griglia",P:"pinzimonio",T:"verdure",F:"1 frutto",K:"2 verdure di stagione",Q:"pasta o riso",D:"verdure di stagione"}[k])))}</span>${a.m.where?`<span class="small muted">Dove: ${esc(a.m.where)}</span>`:""}</button>`).join("")}</div>`
    : `<p>Nessuna alternativa compatibile: prova a cambiare prima l'altro pasto della giornata.</p>`;
  openSheet((out?"Fuori casa: ":"Scegli: ")+slot,html,(e,close)=>{const b=e.target.closest(".opt"); if(b){close(); setMeal(d,s,b.dataset.id,+b.dataset.g);}});
}
function openSettings(){
  const st=S.settings;
  const html=`<div class="settings">
   <div class="field"><label class="l" for="setStart">Settimana che inizia lunedì</label><input type="date" id="setStart" value="${st.start}"></div>
   <div class="field"><label class="l" for="setPersons">Persone per la spesa</label><input type="number" id="setPersons" min="1" max="8" value="${st.persons}"></div>
   <div class="field"><span class="l">Pranzi fuori casa (bar o ristorante)</span><div class="daychecks">${DSH.slice(0,6).map((x,i)=>`<label><input type="checkbox" id="setOut${i}" ${st.out[i]?"checked":""}>${x}</label>`).join("")}</div><span class="small muted">In quei giorni il pranzo viene scelto dall'elenco "fuori casa" della dottoressa.</span></div>
   <div class="field"><label class="l" for="setScarico">Sera di scarico infrasettimanale</label><select id="setScarico">${[["auto","Scegli tu (di solito mercoledì)"],["1","Martedì"],["2","Mercoledì"],["3","Giovedì"],["4","Venerdì"]].map(([v,l])=>`<option value="${v}" ${String(st.scarico)===v?"selected":""}>${l}</option>`).join("")}</select></div>
   <div><button class="btn primary" data-apply>Salva e crea la proposta</button> <button class="btn" data-savesettings>Salva soltanto</button></div>
  </div>`;
  openSheet("Impostazioni",html,(e,close)=>{
    const ap=e.target.closest("[data-apply]"), sv=e.target.closest("[data-savesettings]");
    if(!ap&&!sv) return;
    const startVal=document.getElementById("setStart").value; let sd=startVal?parseISO(startVal):nextMonday();
    const wd=(sd.getDay()+6)%7; sd=addDays(sd,-wd);
    const persons=Math.max(1,Math.min(8,parseInt(document.getElementById("setPersons").value)||1));
    S.settings={start:iso(sd),persons,out:[0,1,2,3,4,5].map(i=>document.getElementById("setOut"+i).checked),scarico:document.getElementById("setScarico").value};
    close();
    if(ap) newWeek(); else { if(S.plan&&S.plan.start!==S.settings.start){S.plan.start=S.settings.start;} save(); render(); toast("Impostazioni salvate"); }
  });
}

/* ===================== STAMPA / SCARICA ===================== */
function printableHTML(){
  const p=S.plan; const a=parseISO(p.start), b=addDays(a,6);
  const title=`Settimana ${a.getDate()} ${MONTHS[a.getMonth()]} - ${b.getDate()} ${MONTHS[b.getMonth()]} ${b.getFullYear()}`;
  const cell=(d,s)=>{const x=p.days[d][s]; if(!x||x.free) return "<i>Libero</i>"; const m=BYID[x.id]; return esc(x.text||m.t)+(m.out?` <span class="w">(${esc(m.where)})</span>`:"");};
  const items=shopping(p); const byCat={}; items.forEach(i=>{(byCat[i.c]=byCat[i.c]||[]).push(i);});
  const rare=items.filter(i=>i.r);
  return `<div class="pp"><style>
   .pp{font-family:Inter,Arial,sans-serif;color:#000}
   .pp h1{font-size:15pt;margin:0 0 6px} .pp h2{font-size:12pt;margin:10px 0 4px}
   .pp table{width:100%;border-collapse:collapse;font-size:9.5pt} .pp td,.pp th{border:1px solid #888;padding:5px 6px;vertical-align:top;text-align:left}
   .pp th{background:#eee} .pp .d{width:13%;font-weight:700} .pp .w{color:#555;font-size:8.5pt}
   .pp .cols{columns:3;column-gap:18px;font-size:9.5pt} .pp .cat{break-inside:avoid;margin-bottom:8px} .pp ul{margin:2px 0;padding-left:16px}
   .pp .pb{break-before:page;page-break-before:always} .pp .note{font-size:8.5pt;color:#444;margin-top:6px}
  </style>
  <h1 style="display:flex;align-items:center;gap:10px"><img src="${ICON}" alt="" style="width:34px;height:34px">PAS · ${title}</h1>
  <table><thead><tr><th class="d">Giorno</th><th>Pranzo</th><th>Cena</th></tr></thead><tbody>
  ${DAYS.map((dn,d)=>`<tr><td class="d">${dn} ${a.getDate()+0===0?"":dateLabel(p.start,d)}</td><td>${cell(d,"L")}</td><td>${cell(d,"D")}</td></tr>`).join("")}
  </tbody></table>
  <p class="note">Colazioni e merende a scelta dallo schema. Frutta nelle merende sempre con noci, mandorle, nocciole o semi. Fuori casa: con il primo niente pane né frutta; con il fritto verdura cruda; con il pesce niente verdura cotta a foglia verde; a cena niente tonno in scatola, salmone affumicato, mozzarella o affettati.</p>
  <div class="pb"><h1>Lista della spesa (${S.settings.persons} ${S.settings.persons>1?"persone":"persona"})</h1>
  ${rare.length?`<h2>Da procurare in anticipo</h2><p style="font-size:9.5pt">${rare.map(i=>esc(i.n)+" ("+fmtQ(i)+")").join(" · ")}</p>`:""}
  <div class="cols">${Object.keys(CATS).filter(c=>byCat[c]).map(c=>`<div class="cat"><b>${CATS[c]}</b><ul>${byCat[c].sort((x,y)=>x.n.localeCompare(y.n)).map(i=>`<li>☐ ${esc(i.n)}: ${fmtQ(i)}</li>`).join("")}</ul></div>`).join("")}</div></div>
  </div>`;
}
async function doPrint(){
  if(!S.plan) return;
  const html=printableHTML();
  if(!window.claude){ document.getElementById("print-area").innerHTML=html; window.print(); return; }
  // dentro claude.ai la stampa diretta non è disponibile: si scarica un file da aprire e stampare
  try{
    const dl=await window.claude.use("downloads");
    if(!dl){ toast("Per stampare apri l'app dal file sul computer"); return; }
    const doc=`<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Settimana ${S.plan.start}</title><style>@page{size:A4 landscape;margin:10mm}body{margin:0}</style></head><body>${html}<script>window.onload=function(){window.print()}<\/script></body></html>`;
    await dl.save({filename:"settimana-"+S.plan.start+".html",data:doc});
    toast("File salvato: aprilo per stamparlo");
  }catch(e){ if(e&&e.code!=="declined") toast("Salvataggio non riuscito"); }
}

/* ===================== EVENTI ===================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-tab]"); if(!t) return;
  if(t.dataset.tab){ui.tab=t.dataset.tab; if(t.dataset.tab==="giorno"){const ti=todayIdx(); if(ti>=0&&!ui.dayTouched) ui.day=ti;} render(); window.scrollTo(0,0); return;}
  const a=t.dataset.act, d=+t.dataset.d, s=t.dataset.s;
  if(a==="new") newWeek();
  else if(a==="swap"){ const alts=alternatives(S.plan,d,s,!!(s==="L"&&S.settings.out[d])); const c=alts.length?rnd(alts):null; if(c) setMeal(d,s,c.m.id,c.g); else toast("Nessuna altra alternativa compatibile"); }
  else if(a==="choose") openChoose(d,s,false);
  else if(a==="out") openChoose(d,s,true);
  else if(a==="prev"){ui.day=Math.max(0,ui.day-1);ui.dayTouched=1;renderDay();}
  else if(a==="next"){ui.day=Math.min(6,ui.day+1);ui.dayTouched=1;renderDay();}
  else if(a==="goday"){ui.day=d;ui.dayTouched=1;renderDay();}
  else if(a==="clearshop"){S.checked={};save();renderShop();}
  else if(a==="copyshop"){
    const items=shopping(S.plan); const byCat={}; items.forEach(i=>{(byCat[i.c]=byCat[i.c]||[]).push(i);});
    const txt=Object.keys(CATS).filter(c=>byCat[c]).map(c=>CATS[c].toUpperCase()+"\n"+byCat[c].map(i=>"- "+i.n+": "+fmtQ(i)+(i.r?" (in anticipo)":"")).join("\n")).join("\n\n");
    const box=document.getElementById("copybox");
    const fallback=()=>{box.hidden=false;box.value=txt;box.focus();box.select();toast("Seleziona e copia il testo");};
    try{ navigator.clipboard.writeText(txt).then(()=>toast("Lista copiata"),fallback); }catch(err){ fallback(); }
  }
});
